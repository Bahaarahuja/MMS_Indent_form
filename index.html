    async function processFiles() {
      const masterFile = els.masterFile.files[0];
      const stockFile = els.stockFile.files[0];
      const sosrcFile = els.sosrcFile.files[0];
      const previousIndentFile = els.previousIndentFile.files[0];
      const photoMasterFile = els.photoMasterFile.files[0];
      const photoStockFile = els.photoStockFile.files[0];
      const audioMasterFile = els.audioMasterFile.files[0];
      const audioStockFile = els.audioStockFile.files[0];

      if (!masterFile || !stockFile || !sosrcFile || !previousIndentFile || !photoMasterFile || !photoStockFile || !audioMasterFile || !audioStockFile) {
        throw new Error('Please upload all eight files first.');
      }

      setStatus('Reading files');
      log('Reading uploaded files...');

      const [
        masterWb,
        stockWb,
        sosrcWb,
        previousIndentWb,
        photoMasterWb,
        photoStockWb,
        audioMasterWb,
        audioStockWb
      ] = await Promise.all([
        readWorkbook(masterFile),
        readWorkbook(stockFile),
        readWorkbook(sosrcFile),
        readWorkbook(previousIndentFile),
        readWorkbook(photoMasterFile),
        readWorkbook(photoStockFile),
        readWorkbook(audioMasterFile),
        readWorkbook(audioStockFile)
      ]);

      state.previousIndentTemplateBuffer = await previousIndentFile.arrayBuffer();

      const masterSheet = masterWb.Sheets[masterWb.SheetNames[0]];
      const stockSheet = stockWb.Sheets[stockWb.SheetNames[0]];

      const sosrcSheetName = findSheetNameExactOrContains(sosrcWb, 'SOSRC Book List', 'SOSRC');
      if (!sosrcSheetName) {
        throw new Error('Could not find sheet named "SOSRC Book List" in the SOSRC workbook.');
      }
      log(`SOSRC sheet used: ${sosrcSheetName}`);
      const sosrcSheet = sosrcWb.Sheets[sosrcSheetName];

      const photoMasterSheetName = findSheetNameExactOrContains(photoMasterWb, 'Photos Master', 'PHOTO');
      if (!photoMasterSheetName) {
        throw new Error('Could not find sheet named "Photos Master" in the Photos Master workbook.');
      }

      const audioMasterSheetName = findSheetNameExactOrContains(audioMasterWb, 'Audio Master', 'AUDIO');
      if (!audioMasterSheetName) {
        throw new Error('Could not find sheet named "Audio Master" in the Audio Master workbook.');
      }

      log(`Photos master sheet used: ${photoMasterSheetName}`);
      log(`Audio master sheet used: ${audioMasterSheetName}`);

      const photoMasterSheet = photoMasterWb.Sheets[photoMasterSheetName];
      const audioMasterSheet = audioMasterWb.Sheets[audioMasterSheetName];
      const photoStockSheet = photoStockWb.Sheets[photoStockWb.SheetNames[0]];
      const audioStockSheet = audioStockWb.Sheets[audioStockWb.SheetNames[0]];

      const masterRowsRaw = getMasterRows(masterSheet);
      const stockRowsRaw = getHeaderedStockRows(stockSheet);
      const sosrcRowsRaw = getSosrcRows(sosrcSheet);

      const photoMasterRowsRaw = getRowsByHeader(photoMasterSheet, [
        ['Item Number (MMS)', 'ITEM NUMBER (MMS)'],
        ['Short Code', 'SHORT CODE'],
        ['Item Details', 'ITEM DETAILS']
      ], 20, 'Could not detect header row in Photos Master sheet.');

      const audioMasterRowsRaw = getRowsByHeader(audioMasterSheet, [
        ['Item Number (MMS)', 'ITEM NUMBER (MMS)'],
        ['Short Code', 'SHORT CODE'],
        ['Item Details', 'ITEM DETAILS']
      ], 20, 'Could not detect header row in Audio Master sheet.');

      const photoStockRowsRaw = getHeaderedStockRowsRow2(photoStockSheet);
      const audioStockRowsRaw = getHeaderedStockRowsRow2(audioStockSheet);

      if (!masterRowsRaw.length) throw new Error('Books Master file appears empty.');
      if (!stockRowsRaw.length) throw new Error('Books Stock Position file appears empty after row 3 header parsing.');
      if (!sosrcRowsRaw.length) throw new Error('SOSRC file appears empty.');
      if (!photoMasterRowsRaw.length) throw new Error('Photos Master sheet appears empty.');
      if (!photoStockRowsRaw.length) throw new Error('Photos Stock Position file appears empty.');
      if (!audioMasterRowsRaw.length) throw new Error('Audio Master sheet appears empty.');
      if (!audioStockRowsRaw.length) throw new Error('Audio Stock Position file appears empty.');

      log(`Books master rows loaded: ${masterRowsRaw.length}`);
      log(`Books stock rows loaded: ${stockRowsRaw.length}`);
      log(`SOSRC rows loaded: ${sosrcRowsRaw.length}`);
      log(`Photo master rows loaded: ${photoMasterRowsRaw.length}`);
      log(`Photo stock rows loaded: ${photoStockRowsRaw.length}`);
      log(`Audio master rows loaded: ${audioMasterRowsRaw.length}`);
      log(`Audio stock rows loaded: ${audioStockRowsRaw.length}`);

      const previousBooksSheetName = findSheetNameExactOrContains(previousIndentWb, 'BOOKS', 'BOOK');
      if (!previousBooksSheetName) {
        throw new Error('Could not find Books sheet in Previous Indent file.');
      }

      const previousPhotosSheetName = findSheetNameExactOrContains(previousIndentWb, 'PHOTOS', 'PHOTO');
      const previousCalendarSheetName = findSheetNameExactOrContains(previousIndentWb, 'CALENDAR', 'CALENDAR');
      const previousAudioSheetName = findSheetNameExactOrContains(previousIndentWb, 'AUDIO', 'AUDIO');

      log(`Previous indent Books sheet used: ${previousBooksSheetName}`);
      const previousBooksRowsRaw = getPreviousIndentRows(previousIndentWb.Sheets[previousBooksSheetName]);

      let previousPhotoShortCodeSet = new Set();
      let previousCalendarShortCodeSet = new Set();
      let previousAudioShortCodeSet = new Set();

      if (previousPhotosSheetName) {
        log(`Previous indent Photos sheet used: ${previousPhotosSheetName}`);
        const rows = getPreviousMediaRows(previousIndentWb.Sheets[previousPhotosSheetName], 'Photos');
        previousPhotoShortCodeSet = getShortCodeSetFromPreviousRows(rows);
        log(`Previous indent Photos short codes available: ${previousPhotoShortCodeSet.size}`);
      } else {
        log('No PHOTOS sheet found in Previous Indent file. Photos exception tab will show all generated photos as exceptions.');
      }

      if (previousCalendarSheetName) {
        log(`Previous indent Calendar sheet used: ${previousCalendarSheetName}`);
        const rows = getPreviousMediaRows(previousIndentWb.Sheets[previousCalendarSheetName], 'Calendar');
        previousCalendarShortCodeSet = getShortCodeSetFromPreviousRows(rows);
        log(`Previous indent Calendar short codes available: ${previousCalendarShortCodeSet.size}`);
      } else {
        // Older previous indents may still have Calendar inside PHOTOS, so use PHOTOS as fallback.
        previousCalendarShortCodeSet = previousPhotoShortCodeSet;
        log('No CALENDAR sheet found in Previous Indent file. Calendar exceptions will compare against previous PHOTOS tab as fallback.');
      }

      if (previousAudioSheetName) {
        log(`Previous indent Audio sheet used: ${previousAudioSheetName}`);
        const rows = getPreviousMediaRows(previousIndentWb.Sheets[previousAudioSheetName], 'Audio');
        previousAudioShortCodeSet = getShortCodeSetFromPreviousRows(rows);
        log(`Previous indent Audio short codes available: ${previousAudioShortCodeSet.size}`);
      } else {
        log('No AUDIO sheet found in Previous Indent file. Audio exception tab will show all generated audio as exceptions.');
      }

      const masterFirst = masterRowsRaw[0];
      const stockFirst = stockRowsRaw[0];
      const sosrcFirst = sosrcRowsRaw[0];
      const previousFirst = previousBooksRowsRaw[0];

      const masterCols = {
        language: findColumn(masterFirst, ['Language']),
        langCat: findColumn(masterFirst, ['Laguage Category', 'Language Category']),
        mms: findColumn(masterFirst, ['MMS Code', 'MMS CODE']),
        bookName: findColumn(masterFirst, ['Book Name', 'TITLE', 'Title']),
        shortCode: findColumn(masterFirst, ['Short Code', 'SHORT CODE']),
        identity: findColumn(masterFirst, ['Identity', 'IDENTITY', 'Book Identity', 'Book ID', 'ID']),
        bavCode: findColumn(masterFirst, ['BAV Code', 'BAV CODE', 'Code', 'CODE']),
        salePrice: findColumn(masterFirst, ['Sale Price(Rs.)', 'SALE PRICE', 'Sale Price']),
        costPrice: findColumn(masterFirst, ['Cost Price(Rs.)', 'COST PRICE', 'COST  PRICE', 'Cost Price'])
      };

      const missingMaster = Object.entries(masterCols)
        .filter(([, value]) => !value)
        .map(([key]) => key);

      if (missingMaster.length) {
        log(`Books Master headers found: ${Object.keys(masterFirst).join(' | ')}`, 'error');
        throw new Error(`Books Master file is missing expected columns: ${missingMaster.join(', ')}`);
      }

      const stockMmsCol = findColumn(stockFirst, ['MMS Code', 'MMS CODE']);
      if (!stockMmsCol) throw new Error('Books Stock file MMS Code column not found.');

      const previousCodeCol = findColumn(previousFirst, ['CODE', 'Code']);
      if (!previousCodeCol) throw new Error('Previous Indent Books sheet CODE column not found.');

      const totalStockMap = new Map();
      const vStockMap = new Map();

      for (const row of stockRowsRaw) {
        const mms = normalizeMms(row[stockMmsCol]);
        if (!mms || /#REF!/i.test(mms)) continue;

        const arr = row.__row || [];
        const v = normalizeNumber(arr[21]);
        const am = normalizeNumber(arr[38]);

        totalStockMap.set(mms, v + am);
        vStockMap.set(mms, v);
      }

      const sosrcIdentitySet = new Set();
      for (const row of sosrcRowsRaw) {
        const marker = normalizeKey(row.marker);

        // New SOSRC format:
        // Row 1 is a title like "SOSRC Books".
        // From row 2 onward: Column A = old short code, Column B = SOSRC marker, Column C = identity.
        // We mark every Book Master row with the same Identity as SOSRC.
        // Column C is the main match key. Column A is only a fallback.
        if (!marker || marker === 'SOSRC' || marker.includes('SOSRC')) {
          if (normalizeCode(row.identity)) {
            addIdentityVariantsToSet(sosrcIdentitySet, row.identity);
          } else {
            addIdentityVariantsToSet(sosrcIdentitySet, row.shortCode);
          }
        }
      }

      const previousIndentShortCodeSet = new Set();
      for (const row of previousBooksRowsRaw) {
        const prevFullCode = row[previousCodeCol];
        const prevShortCode = toShortCode(prevFullCode);
        if (prevShortCode) previousIndentShortCodeSet.add(prevShortCode);
      }

      log(`SOSRC identities available: ${sosrcIdentitySet.size}`);
      if (sosrcIdentitySet.size) {
        log(`Sample SOSRC identities: ${[...sosrcIdentitySet].slice(0, 8).join(', ')}`);
      }
      log(`Previous indent Books short codes available: ${previousIndentShortCodeSet.size}`);

      let matchedStock = 0;
      let sosrcCount = 0;

      const processed = masterRowsRaw
        .map((row, idx) => {
          const language = normalizeLanguage(row[masterCols.language]);
          if (!validLangs.includes(language)) return null;

          const mmsCode = normalizeMms(row[masterCols.mms]);
          const title = normalizeText(row[masterCols.bookName]);
          const bavCode = normalizeText(row[masterCols.bavCode]);
          const bavCodeKey = normalizeCode(row[masterCols.bavCode]);
          const shortCodeFromFile = normalizeCode(row[masterCols.shortCode]);
          const shortCodeKey = shortCodeFromFile || toShortCode(bavCodeKey);
          const identityValueFromMaster = row[masterCols.identity];
          const salePrice = normalizeNumber(row[masterCols.salePrice]);
          const costPrice = normalizeNumber(row[masterCols.costPrice]);

          const hasStock = totalStockMap.has(mmsCode);
          if (hasStock) matchedStock += 1;

          const totalStock = totalStockMap.get(mmsCode) || 0;
          const vStock = vStockMap.get(mmsCode) || 0;

          // SOSRC is now matched by Book Master Identity column.
          // The SOSRC upload has identity in column C. If many Book Master rows share that identity,
          // all of those rows are marked SOSRC, even if language/title/BAV code differ.
          const isSosrc = hasAnyIdentityVariant(
            sosrcIdentitySet,
            identityValueFromMaster,
            bavCodeKey,
            shortCodeKey
          );
          if (isSosrc) sosrcCount += 1;

          const isPriorityLang = priorityLangs.includes(language);

          let isGrayStock = false;
          let allIndiaLow = false;
          let dlLow = false;

          if (hasStock) {
            isGrayStock = totalStock < 10;

            if (isPriorityLang) {
              allIndiaLow = totalStock < 100;
              dlLow = vStock < 100;
            } else {
              allIndiaLow = totalStock < 30;
              dlLow = vStock < 30;
            }
          }

          const remarks = [];
          if (isGrayStock) {
            remarks.push('Out of Stock');
          } else if (allIndiaLow) {
            remarks.push('All India low stock');
          } else if (dlLow) {
            remarks.push('DL low stock');
          }
          if (isSosrc) remarks.push('SOSRC');

          return {
            id: `${mmsCode || 'row'}-${idx}`,
            language,
            code: bavCode,
            shortCode: shortCodeKey,
            mmsCode,
            title,
            qty: 0,
            salePrice,
            costPrice,
            remarks: remarks.join(', '),
            hasStock,
            isSosrc,
            isGrayStock,
            isIndiaLow: !isGrayStock && allIndiaLow,
            isDlLow: !isGrayStock && !allIndiaLow && dlLow
          };
        })
        .filter(Boolean);

      state.rows = processed;
      state.exceptionRows = processed.filter(row =>
        row.shortCode && !previousIndentShortCodeSet.has(row.shortCode)
      );

      const photoProcessed = processPhotos(photoMasterRowsRaw, photoStockRowsRaw, previousPhotoShortCodeSet);

      state.calendarRows = photoProcessed.rows.filter(row =>
        normalizeKey(row.category) === 'CALENDAR'
      );
      state.photoRows = photoProcessed.rows.filter(row =>
        normalizeKey(row.category) !== 'CALENDAR'
      );

      state.calendarExceptionRows = state.calendarRows.filter(row =>
        row.shortCode && !previousCalendarShortCodeSet.has(row.shortCode)
      );
      state.photoExceptionRows = state.photoRows.filter(row =>
        row.shortCode && !previousPhotoShortCodeSet.has(row.shortCode)
      );

      const audioProcessed = processAudio(audioMasterRowsRaw, audioStockRowsRaw, previousAudioShortCodeSet);
      state.audioRows = audioProcessed.rows;
      state.audioExceptionRows = audioProcessed.exceptions;

      state.filteredRows = [...processed];
      populateLanguageFilter(processed);
      applyFilters();
      state.matchedStock = matchedStock;
      state.sosrcCount = sosrcCount;

      state.mainWorkbookBlob = null;
      state.exceptionWorkbookBlob = null;

      setStatus('Preview ready');
      log(`Processed Books: ${processed.length}`);
      log(`Processed Photos Latest rows only: ${state.photoRows.length}`);
      log(`Processed Calendar Latest rows only: ${state.calendarRows.length}`);
      log(`Processed Audio Latest rows only: ${state.audioRows.length}`);
      log(`Matched book stock rows: ${matchedStock}. SOSRC matches by identity: ${sosrcCount}.`);
      if (sosrcCount === 0) {
        log('No SOSRC matches found. Check that Book Master has an Identity column and SOSRC Book List column C has matching identities.', 'error');
      }
      log(`Book exception rows: ${state.exceptionRows.length}.`);
      log(`Photo exception rows: ${state.photoExceptionRows.length}.`);
      log(`Calendar exception rows: ${state.calendarExceptionRows.length}.`);
      log(`Audio exception rows: ${state.audioExceptionRows.length}.`);

      els.downloadMainBtn.disabled = false;
      els.downloadExceptionBtn.disabled = false;
    }

    els.buildBtn.addEventListener('click', async () => {
      try {
        els.buildBtn.disabled = true;
        els.downloadMainBtn.disabled = true;
        els.downloadExceptionBtn.disabled = true;
        setStatus('Processing');
        log('Starting build...');
        await processFiles();
      } catch (error) {
        console.error(error);
        setStatus('Error');
        log(error.message || 'Something went wrong.', 'error');
        alert(error.message || 'Something went wrong. Check the log.');
      } finally {
        els.buildBtn.disabled = false;
      }
    });

    els.downloadMainBtn.addEventListener('click', async () => {
      try {
        setStatus('Preparing main file; copying Instructions and ORDER Summary');
        state.mainWorkbookBlob = await buildMainWorkbookBlob();
        saveAs(state.mainWorkbookBlob, 'MMS_Indent_Output.xlsx');
        setStatus('Main file downloaded');
        log('Main Excel file downloaded.');
      } catch (error) {
        console.error(error);
        setStatus('Error');
        log(error.message || 'Could not generate main Excel download.', 'error');
        alert(error.message || 'Could not generate main Excel download.');
      }
    });

    els.downloadExceptionBtn.addEventListener('click', async () => {
      try {
        setStatus('Preparing exception file');
        state.exceptionWorkbookBlob = await buildExceptionWorkbookBlob();
        saveAs(state.exceptionWorkbookBlob, 'MMS_Exception_List.xlsx');
        setStatus('Exception file downloaded');
        log('Exception Excel file downloaded.');
      } catch (error) {
        console.error(error);
        setStatus('Error');
        log(error.message || 'Could not generate exception Excel download.', 'error');
        alert(error.message || 'Could not generate exception Excel download.');
      }
    });

    els.searchInput.addEventListener('input', applyFilters);
    els.languageFilter.addEventListener('change', applyFilters);
    els.remarksFilter.addEventListener('change', applyFilters);
    els.sortFilter.addEventListener('change', applyFilters);

    els.clearFiltersBtn.addEventListener('click', () => {
      els.searchInput.value = '';
      els.languageFilter.value = 'ALL';
      els.remarksFilter.value = 'ALL';
      els.sortFilter.value = 'LANG_TITLE_ASC';
      applyFilters();
    });

    els.resetBtn.addEventListener('click', () => {
      els.masterFile.value = '';
      els.stockFile.value = '';
      els.sosrcFile.value = '';
      els.previousIndentFile.value = '';
      els.photoMasterFile.value = '';
      els.photoStockFile.value = '';
      els.audioMasterFile.value = '';
      els.audioStockFile.value = '';
      els.searchInput.value = '';
      els.languageFilter.innerHTML = '<option value="ALL">All languages</option>';
      els.remarksFilter.value = 'ALL';
      els.sortFilter.value = 'LANG_TITLE_ASC';

      state.rows = [];
      state.filteredRows = [];
      state.groupedRows = [];
      state.photoRows = [];
      state.calendarRows = [];
      state.audioRows = [];
      state.mainWorkbookBlob = null;
      state.exceptionWorkbookBlob = null;
      state.previousIndentTemplateBuffer = null;
      state.matchedStock = 0;
      state.sosrcCount = 0;
      state.languagesShown = 0;
      state.exceptionRows = [];
      state.photoExceptionRows = [];
      state.calendarExceptionRows = [];
      state.audioExceptionRows = [];

      els.booksCount.textContent = '0';
      els.matchCount.textContent = '0';
      els.sosrcCount.textContent = '0';
      els.langCount.textContent = '0';
      els.exceptionCount.textContent = '0';
      els.log.textContent = 'Ready.';
      els.previewTable.style.display = 'none';
      els.previewTable.innerHTML = '';
      els.emptyState.style.display = 'grid';
      els.downloadMainBtn.disabled = true;
      els.downloadExceptionBtn.disabled = true;
      setStatus('Waiting for files');
    });
  </script>
</body>
</html>
