<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MMS Indent Builder</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/exceljs@4.4.0/dist/exceljs.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/file-saver@2.0.5/dist/FileSaver.min.js"></script>
  <style>
    :root {
      --bg: #f7f8fa;
      --panel: #ffffff;
      --panel-2: #fbfbfc;
      --line: #e5e7eb;
      --line-2: #d1d5db;
      --text: #111827;
      --muted: #6b7280;
      --accent: #1d4ed8;
      --shadow: 0 12px 40px rgba(17, 24, 39, 0.06);
      --radius: 18px;

      --excel-header: #d8ffff;
      --excel-group: #00008b;
      --excel-group-text: #ffffff;
      --excel-sosrc: #f8d7da;
      --excel-gray: #bfc3c9;
      --excel-dl: #d9c3a5;
      --excel-india: #d9ead3;
      --excel-body: #d8ffff;
      --excel-border: #111111;
      --sosrc-text: #0000ff;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    .shell {
      width: min(1500px, calc(100% - 32px));
      margin: 24px auto 28px;
    }

    .top-card,
    .preview-card {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 20px;
      box-shadow: var(--shadow);
    }

    .top-card { padding: 18px; }

    .subcard {
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--panel-2);
      padding: 18px;
    }

    .upload-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 12px;
    }

    .upload-box {
      border: 1px solid #d6d9df;
      border-radius: 16px;
      padding: 16px;
      transition: all 0.25s ease;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.04);
      position: relative;
    }

    .upload-box:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 18px rgba(0, 0, 0, 0.08);
    }

    .upload-box.books-master { background: #EAF4FF; }
    .upload-box.books-stock { background: #DDF0FF; }
    .upload-box.sosrc { background: #EAF8EF; }
    .upload-box.previous-indent { background: #FFF7D8; }
    .upload-box.photos-master { background: #FFEFF5; }
    .upload-box.photos-stock { background: #FFE4EF; }
    .upload-box.audio-master { background: #F1ECFF; }
    .upload-box.audio-stock { background: #E8E0FF; }

    .upload-box label,
    .toolbar-filter label {
      display: block;
      font-weight: 700;
      font-size: 12px;
      margin-bottom: 6px;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: .03em;
    }

    input[type="file"],
    input[type="search"],
    select {
      width: 100%;
      padding: 10px 12px;
      font: inherit;
      color: var(--text);
      background: white;
      border: 1px solid var(--line);
      border-radius: 12px;
      outline: none;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(5, minmax(0, 1fr));
      gap: 12px;
      margin-top: 14px;
    }

    .stat {
      border: 1px solid var(--line);
      border-radius: 14px;
      background: white;
      padding: 14px;
    }

    .stat .k {
      display: block;
      font-size: 24px;
      font-weight: 800;
      letter-spacing: -0.03em;
      margin-bottom: 4px;
    }

    .stat .l {
      color: var(--muted);
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: .03em;
      font-weight: 600;
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 14px;
    }

    button {
      appearance: none;
      border: 1px solid transparent;
      background: white;
      color: var(--text);
      font: inherit;
      font-weight: 600;
      font-size: 14px;
      padding: 11px 16px;
      border-radius: 12px;
      cursor: pointer;
      transition: .15s ease;
      white-space: nowrap;
    }

    button:hover { transform: translateY(-1px); }
    button:disabled { opacity: .55; cursor: not-allowed; transform: none; }

    .btn-primary {
      background: var(--accent);
      color: white;
      border-color: var(--accent);
    }

    .btn-secondary {
      border-color: var(--line-2);
      background: white;
    }

    .preview-card {
      margin-top: 18px;
      overflow: hidden;
    }

    .preview-toolbar {
      padding: 16px 18px;
      border-bottom: 1px solid var(--line);
      background: white;
      display: grid;
      gap: 14px;
    }

    .preview-toolbar-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
    }

    .preview-toolbar h2 {
      margin: 0;
      font-size: 18px;
    }

    .toolbar-right {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .toolbar-filters {
      display: grid;
      grid-template-columns: 2fr 1fr 1fr 1fr auto;
      gap: 10px;
      align-items: end;
    }

    .toolbar-filter { min-width: 0; }

    .status {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 8px 12px;
      border-radius: 999px;
      border: 1px solid var(--line);
      background: white;
      color: var(--muted);
      font-size: 13px;
      font-weight: 500;
    }

    .dot {
      width: 8px;
      height: 8px;
      border-radius: 999px;
      background: #10b981;
    }

    .table-wrap {
      height: 74vh;
      min-height: 520px;
      overflow: auto;
      background: white;
    }

    table {
      width: 100%;
      min-width: 1220px;
      border-collapse: separate;
      border-spacing: 0;
      table-layout: fixed;
    }

    col.code-col { width: 115px; }
    col.mms-col { width: 67px; }
    col.title-col { width: 327px; }
    col.remarks-col { width: 140px; }
    col.qty-col { width: 67px; }
    col.sale-col { width: 75px; }
    col.cost-col { width: 72px; }
    col.saleamt-col { width: 83px; }
    col.costamt-col { width: 95px; }

    thead th {
      position: sticky;
      z-index: 5;
      background: var(--excel-header);
      color: #111827;
      border-right: 1px solid var(--excel-border);
      border-bottom: 1px solid var(--excel-border);
      border-top: 1px solid var(--excel-border);
      padding: 13px 8px;
      text-align: center;
      font-size: 12px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: .03em;
      white-space: nowrap;
    }

    thead tr:first-child th {
      top: 0;
      font-size: 16px;
      text-transform: none;
      letter-spacing: 0;
      font-weight: 500;
      height: 54px;
    }

    thead tr:nth-child(2) th {
      top: 54px;
      font-size: 18px;
      line-height: 1.1;
      height: 74px;
    }

    thead th:first-child,
    tbody td:first-child { border-left: 1px solid var(--excel-border); }

    tbody td {
      padding: 11px 10px;
      border-right: 1px solid var(--excel-border);
      border-bottom: 1px solid var(--excel-border);
      font-size: 14px;
      vertical-align: top;
      background: var(--excel-body);
    }

    tbody tr:hover td { filter: brightness(0.99); }

    .group-row td {
      position: sticky;
      top: 128px;
      z-index: 4;
      background: var(--excel-group);
      color: var(--excel-group-text);
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: .03em;
      border-top: 1px solid var(--excel-border);
      border-bottom: 1px solid var(--excel-border);
      height: 34px;
      padding: 4px 10px;
    }

    .data-row td { background: var(--excel-body); }
    .data-row.sosrc-row td { background: var(--excel-sosrc); }
    .data-row.sosrc-row.india-row td,
    .data-row.india-row td { background: var(--excel-india); }
    .data-row.sosrc-row.dl-row td,
    .data-row.dl-row td { background: var(--excel-dl); }
    .data-row.sosrc-row.gray-row td,
    .data-row.india-row.gray-row td,
    .data-row.dl-row.gray-row td,
    .data-row.gray-row td { background: var(--excel-gray); }

    .data-row td.qty-cell { background: #ffffff !important; }
    .data-row.gray-row td.qty-cell { background: var(--excel-gray) !important; }

    .qty-cell input {
      width: 54px;
      padding: 7px 8px;
      border: 1px solid #9ca3af;
      border-radius: 4px;
      font: inherit;
      background: #ffffff;
    }

    .data-row.gray-row .qty-cell input { background: var(--excel-gray); }

    .title-cell,
    .code-cell,
    .mms-cell { font-weight: 600; }

    .remarks-text {
      font-size: 12px;
      font-weight: 700;
      line-height: 1.35;
      white-space: pre-line;
    }

    .sosrc-remark {
      color: var(--sosrc-text);
      font-style: italic;
    }

    .empty {
      display: grid;
      place-items: center;
      height: 100%;
      text-align: center;
      padding: 40px 20px;
      color: var(--muted);
    }

    .empty h3 {
      margin: 14px 0 6px;
      color: var(--text);
      font-size: 22px;
    }

    .empty p {
      margin: 0;
      max-width: 580px;
      line-height: 1.7;
    }

    .log {
      margin-top: 14px;
      border: 1px solid var(--line);
      border-radius: 14px;
      background: white;
      padding: 12px 14px;
      max-height: 180px;
      overflow: auto;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.6;
      white-space: pre-wrap;
    }

    @media (max-width: 1280px) {
      .upload-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    }

    @media (max-width: 1180px) {
      .toolbar-filters { grid-template-columns: 1fr 1fr; }
    }

    @media (max-width: 700px) {
      .upload-grid,
      .toolbar-filters { grid-template-columns: 1fr; }
    }

    @media (max-width: 640px) {
      .shell { width: min(100% - 16px, 1440px); margin: 16px auto 20px; }
      .top-card { padding: 18px; }
      .stats { grid-template-columns: 1fr 1fr; }
      .toolbar-right { width: 100%; }
    }



    /* Softer earth-tone upload-card colors: stock cards are one shade darker than master cards */
    .upload-box {
      border: 1px solid #d8d2c6 !important;
      border-radius: 16px !important;
      padding: 16px !important;
      box-shadow: 0 2px 8px rgba(17, 24, 39, 0.04) !important;
    }

    .upload-box label {
      font-weight: 900 !important;
      color: #1f2937 !important;
      letter-spacing: .045em !important;
      font-size: 12px !important;
    }

    .upload-box.books-master { background: #eaf3f7 !important; }  /* light blue */
    .upload-box.books-stock { background: #dcecf2 !important; }   /* one shade darker blue */

    .upload-box.sosrc { background: #edf5e8 !important; }         /* light green */
    .upload-box.previous,
    .upload-box.previous-indent { background: #f8f1d8 !important; } /* light yellow */

    .upload-box.photo-master,
    .upload-box.photos-master { background: #faeadc !important; } /* light peach */
    .upload-box.photo-stock,
    .upload-box.photos-stock { background: #f3ddc6 !important; }  /* one shade darker peach */

    .upload-box.audio-master { background: #eef6ec !important; }  /* light green */
    .upload-box.audio-stock { background: #dfeeda !important; }   /* one shade darker green */

    .upload-box input[type="file"] {
      background: rgba(255, 255, 255, 0.74) !important;
      border-color: #d4d4d4 !important;
    }


    .data-row.gray-row .qty-cell input,
    .qty-cell input:disabled {
      background: var(--excel-gray) !important;
      color: #6b7280 !important;
      cursor: not-allowed !important;
      border-color: #8b9098 !important;
      opacity: 1 !important;
    }

  </style>
</head>
<body>
  <div class="shell">
    <section class="top-card">
      <div class="subcard">
        <div class="upload-grid">
          <div class="upload-box books-master">
            <label for="masterFile">BOOKS MASTER</label>
            <input id="masterFile" type="file" accept=".xlsx,.xls,.csv,text/csv,application/vnd.ms-excel,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" />
          </div>
          <div class="upload-box books-stock">
            <label for="stockFile">BOOKS STOCK POSITION</label>
            <input id="stockFile" type="file" accept=".xlsx,.xls,.csv,text/csv,application/vnd.ms-excel,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" />
          </div>
          <div class="upload-box sosrc">
            <label for="sosrcFile">SOSRC BOOK LIST</label>
            <input id="sosrcFile" type="file" accept=".xlsx,.xls,.csv,text/csv,application/vnd.ms-excel,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" />
          </div>
          <div class="upload-box previous-indent">
            <label for="previousIndentFile">PREVIOUS INDENT</label>
            <input id="previousIndentFile" type="file" accept=".xlsx,.xls,.csv,text/csv,application/vnd.ms-excel,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" />
          </div>

          <div class="upload-box photos-master">
            <label for="photoMasterFile">PHOTOS MASTER Workbook</label>
            <input id="photoMasterFile" type="file" accept=".xlsx,.xls,.csv,text/csv,application/vnd.ms-excel,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" />
          </div>
          <div class="upload-box photos-stock">
            <label for="photoStockFile">PHOTOS STOCK POSITION</label>
            <input id="photoStockFile" type="file" accept=".xlsx,.xls,.csv,text/csv,application/vnd.ms-excel,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" />
          </div>
          <div class="upload-box audio-master">
            <label for="audioMasterFile">AUDIO MASTER Workbook</label>
            <input id="audioMasterFile" type="file" accept=".xlsx,.xls,.csv,text/csv,application/vnd.ms-excel,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" />
          </div>
          <div class="upload-box audio-stock">
            <label for="audioStockFile">AUDIO STOCK POSITION</label>
            <input id="audioStockFile" type="file" accept=".xlsx,.xls,.csv,text/csv,application/vnd.ms-excel,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" />
          </div>
        </div>

        <div class="actions">
          <button id="buildBtn" class="btn-primary">Build preview</button>
          <button id="downloadMainBtn" class="btn-primary" disabled>Download Main Excel</button>
          <button id="downloadExceptionBtn" class="btn-primary" disabled>Download Exception Excel</button>
          <button id="resetBtn" class="btn-secondary">Reset</button>
        </div>

        <div class="stats" style="margin-top:16px;">
          <div class="stat"><span id="booksCount" class="k">0</span><span class="l">Shown books</span></div>
          <div class="stat"><span id="matchCount" class="k">0</span><span class="l">Shown matched stock</span></div>
          <div class="stat"><span id="sosrcCount" class="k">0</span><span class="l">Shown SOSRC items</span></div>
          <div class="stat"><span id="langCount" class="k">0</span><span class="l">Shown languages</span></div>
          <div class="stat"><span id="exceptionCount" class="k">0</span><span class="l">Exception items</span></div>
        </div>

        <div id="log" class="log">Ready.</div>
      </div>
    </section>

    <section class="preview-card">
      <div class="preview-toolbar">
        <div class="preview-toolbar-top">
          <div>
            <h2>Preview (Books)</h2>
          </div>
          <div class="toolbar-right">
            <div class="status"><span class="dot"></span><span id="statusText">Waiting for files</span></div>
          </div>
        </div>

        <div class="toolbar-filters">
          <div class="toolbar-filter">
            <label for="searchInput">Search</label>
            <input id="searchInput" type="search" placeholder="Search by title, MMS code, BAV code, or remarks" />
          </div>

          <div class="toolbar-filter">
            <label for="languageFilter">Language</label>
            <select id="languageFilter">
              <option value="ALL">All languages</option>
            </select>
          </div>

          <div class="toolbar-filter">
            <label for="remarksFilter">Remarks</label>
            <select id="remarksFilter">
              <option value="ALL">All remarks</option>
              <option value="SOSRC">SOSRC</option>
              <option value="Out of Stock">Out of Stock</option>
              <option value="All India low stock">All India low stock</option>
              <option value="DL low stock">DL low stock</option>
              <option value="NO_REMARKS">No remarks</option>
            </select>
          </div>

          <div class="toolbar-filter">
            <label for="sortFilter">Sort</label>
            <select id="sortFilter">
              <option value="LANG_TITLE_ASC">Language + Title A-Z</option>
              <option value="TITLE_ASC">Title A-Z</option>
              <option value="TITLE_DESC">Title Z-A</option>
              <option value="MMS_ASC">MMS Code Low-High</option>
              <option value="MMS_DESC">MMS Code High-Low</option>
              <option value="CODE_ASC">Code A-Z</option>
              <option value="CODE_DESC">Code Z-A</option>
              <option value="SALE_ASC">Sale Price Low-High</option>
              <option value="SALE_DESC">Sale Price High-Low</option>
              <option value="COST_ASC">Cost Price Low-High</option>
              <option value="COST_DESC">Cost Price High-Low</option>
            </select>
          </div>

          <div class="toolbar-filter">
            <label>&nbsp;</label>
            <button id="clearFiltersBtn" class="btn-secondary" style="width:100%;">Clear</button>
          </div>
        </div>
      </div>

      <div id="tableWrap" class="table-wrap">
        <div class="empty" id="emptyState">
          <div>
            <svg width="56" height="56" viewBox="0 0 24 24" fill="none" aria-hidden="true">
              <path d="M12 16V8M8.5 11.5 12 8l3.5 3.5" stroke="#94a3b8" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
              <path d="M20 15.5A3.5 3.5 0 0 0 17 9a5.5 5.5 0 0 0-10.58 1.89A4 4 0 0 0 7 19h11a3 3 0 0 0 2-5.5Z" stroke="#94a3b8" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
            <h3>No preview yet</h3>
            <p>Upload the files and build the preview.</p>
          </div>
        </div>
        <table id="previewTable" style="display:none"></table>
      </div>
    </section>
  </div>

  <script>
    const validLangs = [
      'ENGLISH', 'HINDI', 'PUNJABI', 'ASSAMESE', 'BENGALI', 'GUJARATI',
      'KANNADA', 'KONKANI', 'MALAYALAM', 'MARATHI', 'NEPALI', 'ODIA',
      'SINDHI', 'SWAHILI', 'TAMIL', 'TELUGU', 'URDU'
    ];

    const priorityLangs = ['ENGLISH', 'HINDI', 'PUNJABI'];

    const state = {
      rows: [],
      filteredRows: [],
      groupedRows: [],
      photoRows: [],
      calendarRows: [],
      audioRows: [],
      mainWorkbookBlob: null,
      exceptionWorkbookBlob: null,
      previousIndentTemplateBuffer: null,
      matchedStock: 0,
      sosrcCount: 0,
      languagesShown: 0,
      exceptionRows: [],
      photoExceptionRows: [],
      calendarExceptionRows: [],
      audioExceptionRows: []
    };

    const els = {
      masterFile: document.getElementById('masterFile'),
      stockFile: document.getElementById('stockFile'),
      sosrcFile: document.getElementById('sosrcFile'),
      previousIndentFile: document.getElementById('previousIndentFile'),
      photoMasterFile: document.getElementById('photoMasterFile'),
      photoStockFile: document.getElementById('photoStockFile'),
      audioMasterFile: document.getElementById('audioMasterFile'),
      audioStockFile: document.getElementById('audioStockFile'),
      buildBtn: document.getElementById('buildBtn'),
      downloadMainBtn: document.getElementById('downloadMainBtn'),
      downloadExceptionBtn: document.getElementById('downloadExceptionBtn'),
      resetBtn: document.getElementById('resetBtn'),
      clearFiltersBtn: document.getElementById('clearFiltersBtn'),
      searchInput: document.getElementById('searchInput'),
      languageFilter: document.getElementById('languageFilter'),
      remarksFilter: document.getElementById('remarksFilter'),
      sortFilter: document.getElementById('sortFilter'),
      log: document.getElementById('log'),
      statusText: document.getElementById('statusText'),
      previewTable: document.getElementById('previewTable'),
      emptyState: document.getElementById('emptyState'),
      booksCount: document.getElementById('booksCount'),
      matchCount: document.getElementById('matchCount'),
      sosrcCount: document.getElementById('sosrcCount'),
      langCount: document.getElementById('langCount'),
      exceptionCount: document.getElementById('exceptionCount')
    };

    function log(message, type = 'info') {
      const stamp = new Date().toLocaleTimeString();
      const prefix = type === 'error' ? '[error]' : '[info]';
      els.log.innerHTML += `\n${stamp} ${prefix} ${escapeHtml(message)}`;
      els.log.scrollTop = els.log.scrollHeight;
    }

    function setStatus(text) {
      els.statusText.textContent = text;
    }

    function escapeHtml(value) {
      return String(value)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    function normalizeKey(value) {
      return String(value ?? '')
        .replace(/^\uFEFF/, '')
        .replace(/\u00a0/g, ' ')
        .replace(/\n/g, ' ')
        .replace(/\s+/g, ' ')
        .trim()
        .toUpperCase();
    }

    function normalizeText(value) {
      return String(value ?? '')
        .replace(/^\uFEFF/, '')
        .replace(/\u00a0/g, ' ')
        .replace(/\n/g, ' ')
        .replace(/\s+/g, ' ')
        .trim();
    }

    function normalizeLanguage(value) {
      let language = normalizeText(value).toUpperCase();
      if (language === 'TELEGU') language = 'TELUGU';
      return language;
    }

    function getLanguageRank(language) {
      const lang = normalizeLanguage(language);
      const idx = priorityLangs.indexOf(lang);
      if (idx !== -1) return idx;
      return 999;
    }

    function normalizeMms(value) {
      return String(value ?? '')
        .replace(/^\uFEFF/, '')
        .replace(/\.0$/, '')
        .trim();
    }

    function normalizeCode(value) {
      return String(value ?? '')
        .replace(/^\uFEFF/, '')
        .replace(/\u00a0/g, ' ')
        .replace(/\s+/g, ' ')
        .trim()
        .toUpperCase();
    }

    function toShortCode(value) {
      const code = normalizeCode(value);
      return code ? code.slice(0, 8) : '';
    }

    function normalizeNumber(value) {
      if (value === null || value === undefined || value === '') return 0;
      if (typeof value === 'number' && Number.isFinite(value)) return value;

      const cleaned = String(value)
        .replace(/,/g, '')
        .replace(/[^0-9.\-]/g, '')
        .trim();

      if (cleaned === '' || cleaned === '-' || cleaned === '.') return 0;

      const num = Number(cleaned);
      return Number.isFinite(num) ? num : 0;
    }

    function compareMixed(a, b) {
      const aNum = Number(a);
      const bNum = Number(b);
      const aNumOk = !Number.isNaN(aNum) && String(a).trim() !== '';
      const bNumOk = !Number.isNaN(bNum) && String(b).trim() !== '';

      if (aNumOk && bNumOk) return aNum - bNum;
      return String(a).localeCompare(String(b), undefined, { numeric: true, sensitivity: 'base' });
    }

    function findColumn(obj, candidates) {
      const keys = Object.keys(obj || {});
      const map = new Map(keys.map(k => [normalizeKey(k), k]));
      for (const candidate of candidates) {
        const found = map.get(normalizeKey(candidate));
        if (found) return found;
      }
      return null;
    }

    function findSheetNameExactOrContains(workbook, preferredName, fallbackKeyword = '') {
      const exact = workbook.SheetNames.find(name => normalizeKey(name) === normalizeKey(preferredName));
      if (exact) return exact;

      if (fallbackKeyword) {
        const contains = workbook.SheetNames.find(name => normalizeKey(name).includes(normalizeKey(fallbackKeyword)));
        if (contains) return contains;
      }

      return null;
    }

    async function readWorkbook(file) {
      const fileName = (file.name || '').toLowerCase();

      if (fileName.endsWith('.csv')) {
        const text = await file.text();
        return XLSX.read(text, { type: 'string' });
      }

      const buffer = await file.arrayBuffer();
      return XLSX.read(buffer, { type: 'array' });
    }

    function getSheetMatrix(sheet) {
      return XLSX.utils.sheet_to_json(sheet, { header: 1, defval: '', raw: false });
    }

    function rowsFromHeaderIndex(matrix, headerIndex) {
      if (headerIndex < 0) return [];
      const headerRow = matrix[headerIndex] || [];
      const dataRows = matrix.slice(headerIndex + 1);

      return dataRows
        .filter(row => row.some(cell => String(cell).trim() !== ''))
        .map(row => {
          const obj = {};
          headerRow.forEach((h, idx) => {
            const key = String(h ?? '').trim();
            obj[key] = row[idx] ?? '';
          });
          return obj;
        });
    }

    function detectHeaderRow(matrix, requiredCandidatesList, maxScanRows = 12) {
      const scanLimit = Math.min(matrix.length, maxScanRows);

      for (let i = 0; i < scanLimit; i++) {
        const row = matrix[i] || [];
        const normalized = row.map(cell => normalizeKey(cell));
        const rowSet = new Set(normalized);

        const matchesAll = requiredCandidatesList.every(candidateGroup =>
          candidateGroup.some(candidate => rowSet.has(normalizeKey(candidate)))
        );

        if (matchesAll) return i;
      }

      return -1;
    }

    function getRowsByHeader(sheet, requiredCandidatesList, maxScanRows, errorMessage) {
      const matrix = getSheetMatrix(sheet);
      const headerIndex = detectHeaderRow(matrix, requiredCandidatesList, maxScanRows);
      if (headerIndex === -1) throw new Error(errorMessage);
      return rowsFromHeaderIndex(matrix, headerIndex);
    }

    function getMasterRows(sheet) {
      return getRowsByHeader(sheet, [
        ['Language'],
        ['MMS Code', 'MMS CODE'],
        ['Book Name', 'TITLE', 'Title']
      ], 20, 'Could not detect header row in Books Master file.');
    }

    function getSosrcRows(sheet) {
      const matrix = getSheetMatrix(sheet);

      return matrix
        .slice(1)
        .filter(row => row.some(cell => String(cell).trim() !== ''))
        .map(row => ({
          shortCode: row[0] ?? '',
          marker: row[1] ?? '',
          identity: row[2] ?? ''
        }));
    }

    function normalizeIdentityPart(part) {
      const text = String(part ?? '').trim().toUpperCase();
      if (/^\d+$/.test(text)) {
        return String(Number(text));
      }
      return text;
    }

    function identityVariants(value) {
      const raw = normalizeCode(value)
        .replace(/\s+/g, '')
        .replace(/[–—]/g, '-');

      const variants = new Set();
      if (!raw) return variants;

      variants.add(raw);

      const parts = raw.split('-').filter(Boolean);
      let identityParts = [];

      // Full/short BAV pattern with language prefix, e.g. EN-052-0 or EN-052-0-01-05.
      if (parts.length >= 3 && /^[A-Z]{2,4}$/.test(parts[0])) {
        identityParts = [parts[1], parts[2]];
      } else if (parts.length >= 2) {
        // Identity already provided, e.g. 052-0 or 52-0.
        identityParts = [parts[0], parts[1]];
      }

      if (identityParts.length) {
        const exact = `${identityParts[0]}-${identityParts[1]}`.toUpperCase();
        const noLeadingZeros = `${normalizeIdentityPart(identityParts[0])}-${normalizeIdentityPart(identityParts[1])}`.toUpperCase();

        variants.add(exact);
        variants.add(noLeadingZeros);

        // Also add padded 3-digit version for cases like 52-0 vs 052-0.
        if (/^\d+$/.test(normalizeIdentityPart(identityParts[0]))) {
          const padded = `${normalizeIdentityPart(identityParts[0]).padStart(3, '0')}-${normalizeIdentityPart(identityParts[1])}`.toUpperCase();
          variants.add(padded);
        }
      }

      return variants;
    }

    function identityFromShortCode(value) {
      return [...identityVariants(value)][0] || '';
    }

    function addIdentityVariantsToSet(set, value) {
      for (const variant of identityVariants(value)) {
        if (variant) set.add(variant);
      }
    }

    function hasAnyIdentityVariant(set, ...values) {
      for (const value of values) {
        for (const variant of identityVariants(value)) {
          if (set.has(variant)) return true;
        }
      }
      return false;
    }

    function getPreviousIndentRows(sheet) {
      return getRowsByHeader(sheet, [
        ['CODE', 'Code'],
        ['MMS CODE', 'MMS Code', 'MMSCODE'],
        ['TITLE', 'Title']
      ], 30, 'Could not detect header row in Previous Indent Books sheet.');
    }

    function getPreviousMediaRows(sheet, label) {
      return getRowsByHeader(sheet, [
        ['CODE', 'Code'],
        ['MMS CODE', 'MMS Code', 'MMSCODE'],
        ['TITLE', 'Title']
      ], 40, `Could not detect header row in Previous Indent ${label} sheet.`);
    }

    function getHeaderedStockRows(sheet) {
      const raw = getSheetMatrix(sheet);
      const headerRow = raw[2] || [];
      const dataRows = raw.slice(3);

      return dataRows
        .filter(row => row.some(cell => String(cell).trim() !== ''))
        .map(row => {
          const obj = {};
          headerRow.forEach((h, idx) => {
            obj[String(h).trim()] = row[idx] ?? '';
          });
          obj.__row = row;
          return obj;
        });
    }

    function getHeaderedStockRowsRow2(sheet) {
      const raw = getSheetMatrix(sheet);
      const headerRow = raw[1] || [];
      const dataRows = raw.slice(2);

      return dataRows
        .filter(row => row.some(cell => String(cell).trim() !== ''))
        .map(row => {
          const obj = {};
          headerRow.forEach((h, idx) => {
            obj[String(h).trim()] = row[idx] ?? '';
          });
          obj.__row = row;
          return obj;
        });
    }

    function currency(value) {
      return Number(value || 0).toLocaleString(undefined, {
        minimumFractionDigits: 2,
        maximumFractionDigits: 2
      });
    }

    function buildGroupedRows(rows) {
      const out = [];
      let shown = 0;

      for (const lang of priorityLangs) {
        const group = rows.filter(r => r.language === lang);
        if (!group.length) continue;
        shown += 1;
        out.push({ type: 'group', label: `${lang} BOOKS` });
        out.push(...group.map(r => ({ type: 'book', ...r })));
      }

      const otherLangs = [...new Set(rows.map(r => r.language).filter(Boolean))]
        .filter(lang => !priorityLangs.includes(lang))
        .sort((a, b) => a.localeCompare(b));

      for (const lang of otherLangs) {
        const group = rows.filter(r => r.language === lang);
        if (!group.length) continue;
        shown += 1;
        out.push({ type: 'group', label: `${lang} BOOKS` });
        out.push(...group.map(r => ({ type: 'book', ...r })));
      }

      state.languagesShown = shown;
      return out;
    }

    function buildGroupedMediaRows(rows, kind) {
      const out = [];
      const fallbackLabel = kind === 'audio' ? 'AUDIO' : (kind === 'calendar' ? 'CALENDAR' : 'PHOTOS');

      const groups = new Map();

      for (const row of rows) {
        const label = kind === 'calendar'
          ? 'CALENDAR'
          : (normalizeText(row.category || fallbackLabel).toUpperCase() || fallbackLabel);
        if (!groups.has(label)) groups.set(label, []);
        groups.get(label).push(row);
      }

      const preferredOrder = kind === 'audio' ? audioCategoryOrder : photoCategoryOrder;

      const labels = [...groups.keys()].sort((a, b) => {
        const ai = preferredOrder.indexOf(a);
        const bi = preferredOrder.indexOf(b);
        if (ai !== -1 && bi !== -1) return ai - bi;
        if (ai !== -1) return -1;
        if (bi !== -1) return 1;
        return a.localeCompare(b);
      });

      for (const label of labels) {
        const groupRows = groups.get(label).sort((a, b) => a.title.localeCompare(b.title, undefined, { sensitivity: 'base' }));
        out.push({ type: 'group', label });
        out.push(...groupRows.map(r => ({ type: 'book', ...r })));
      }

      return out;
    }

    const audioCategoryOrder = [
      'PEN DRIVE (AUDIO)',
      'PUNJABI AUDIO CD - MAHARAJ CHARAN SINGH JI',
      'HINDI AUDIO CD',
      'HINDI AUDIO CD - MAHARAJ JAGAT SINGH JI',
      'HINDI AUDIO CD - MAHARAJ SAWAN SINGH JI',
      'HINDI AUDIO CD - DADA MANGHARAM',
      'HINDI AUDIO CD - DADA BABANI',
      'SHABAD CD',
      'ENGLISH AUDIO QUESTION & ANSWER CD',
      'ENGLISH AUDIO SATSANG CD',
      'DVD VIDEO'
    ];

    const photoCategoryOrder = [
      'BLACK & WHITE',
      'BLACK/WHITE MOUNTED GLOSS',
      'CANVAS PHOTOS (ORDERS SHOULD BE PLACED IN EVEN NUMBERS)',
      'FRAMED PICTURES',
      'LAMINATED',
      'MOUNTED',
      'PHOTO',
      'PRINT',
      'SEPIA PHOTO',
      'SEPIA PRINT',
      'SEPIA PRINT MOUNTD GLOSS'
    ];

    function canonicalAudioCategory(value) {
      const raw = normalizeText(value);
      const key = normalizeKey(raw);

      const map = new Map([
        ['PEN DRIVE AUDIO', 'PEN DRIVE (AUDIO)'],
        ['PEN DRIVE (AUDIO)', 'PEN DRIVE (AUDIO)'],
        ['PUNJABI AUDIO CD - MAHARAJ CHARAN SINGH JI', 'PUNJABI AUDIO CD - MAHARAJ CHARAN SINGH JI'],
        ['PUNJABI AUDIO CD MAHARAJ CHARAN SINGH JI', 'PUNJABI AUDIO CD - MAHARAJ CHARAN SINGH JI'],
        ['HINDI AUDIO CD', 'HINDI AUDIO CD'],
        ['HINDI AUDIO CD - MAHARAJ JAGAT SINGH JI', 'HINDI AUDIO CD - MAHARAJ JAGAT SINGH JI'],
        ['HINDI AUDIO CD MAHARAJ JAGAT SINGH JI', 'HINDI AUDIO CD - MAHARAJ JAGAT SINGH JI'],
        ['HINDI AUDIO CD - MAHARAJ SAWAN SINGH JI', 'HINDI AUDIO CD - MAHARAJ SAWAN SINGH JI'],
        ['HINDI AUDIO CD MAHARAJ SAWAN SINGH JI', 'HINDI AUDIO CD - MAHARAJ SAWAN SINGH JI'],
        ['HINDI AUDIO CD - DADA MANGHARAM', 'HINDI AUDIO CD - DADA MANGHARAM'],
        ['HINDI AUDIO CD DADA MANGHARAM', 'HINDI AUDIO CD - DADA MANGHARAM'],
        ['HINDI AUDIO CD - DADA BABANI', 'HINDI AUDIO CD - DADA BABANI'],
        ['HINDI AUDIO CD DADA BABANI', 'HINDI AUDIO CD - DADA BABANI'],
        ['SHABAD CD', 'SHABAD CD'],
        ['ENGLISH AUDIO QUESTION & ANSWER CD', 'ENGLISH AUDIO QUESTION & ANSWER CD'],
        ['ENGLISH AUDIO QUESTION AND ANSWER CD', 'ENGLISH AUDIO QUESTION & ANSWER CD'],
        ['ENGLISH AUDIO Q&A CD', 'ENGLISH AUDIO QUESTION & ANSWER CD'],
        ['ENGLISH AUDIO SATSANG CD', 'ENGLISH AUDIO SATSANG CD'],
        ['DVD VIDEO', 'DVD VIDEO']
      ]);

      if (map.has(key)) return map.get(key);

      if (key.includes('PEN DRIVE')) return 'PEN DRIVE (AUDIO)';
      if (key.includes('PUNJABI') && key.includes('CHARAN SINGH')) return 'PUNJABI AUDIO CD - MAHARAJ CHARAN SINGH JI';
      if (key.includes('JAGAT SINGH')) return 'HINDI AUDIO CD - MAHARAJ JAGAT SINGH JI';
      if (key.includes('SAWAN SINGH')) return 'HINDI AUDIO CD - MAHARAJ SAWAN SINGH JI';
      if (key.includes('MANGHARAM')) return 'HINDI AUDIO CD - DADA MANGHARAM';
      if (key.includes('BABANI')) return 'HINDI AUDIO CD - DADA BABANI';
      if (key.includes('SHABAD')) return 'SHABAD CD';
      if (key.includes('QUESTION') || key.includes('Q&A')) return 'ENGLISH AUDIO QUESTION & ANSWER CD';
      if (key.includes('ENGLISH') && key.includes('SATSANG')) return 'ENGLISH AUDIO SATSANG CD';
      if (key.includes('DVD')) return 'DVD VIDEO';
      if (key.includes('HINDI') && key.includes('AUDIO')) return 'HINDI AUDIO CD';

      return raw ? raw.toUpperCase() : 'AUDIO';
    }

    function canonicalPhotoCategory(value) {
      const raw = normalizeText(value);
      const key = normalizeKey(raw);

      const map = new Map([
        ['BLACK & WHITE', 'BLACK & WHITE'],
        ['BLACK AND WHITE', 'BLACK & WHITE'],
        ['BLACK/WHITE MOUNTED GLOSS', 'BLACK/WHITE MOUNTED GLOSS'],
        ['BLACK WHITE MOUNTED GLOSS', 'BLACK/WHITE MOUNTED GLOSS'],
        ['BLACK/WHITE MOUNTED GLOSSY', 'BLACK/WHITE MOUNTED GLOSS'],
        ['CANVAS PHOTOS', 'CANVAS PHOTOS (ORDERS SHOULD BE PLACED IN EVEN NUMBERS)'],
        ['CANVAS PHOTOS (ORDERS SHOULD BE PLACED IN EVEN NUMBERS)', 'CANVAS PHOTOS (ORDERS SHOULD BE PLACED IN EVEN NUMBERS)'],
        ['FRAMED PICTURES', 'FRAMED PICTURES'],
        ['LAMINATED', 'LAMINATED'],
        ['MOUNTED', 'MOUNTED'],
        ['PHOTO', 'PHOTO'],
        ['PRINT', 'PRINT'],
        ['SEPIA PHOTO', 'SEPIA PHOTO'],
        ['SEPIA PRINT', 'SEPIA PRINT'],
        ['SEPIA PRINT MOUNTD GLOSS', 'SEPIA PRINT MOUNTD GLOSS'],
        ['SEPIA PRINT MOUNTED GLOSS', 'SEPIA PRINT MOUNTD GLOSS']
      ]);

      if (map.has(key)) return map.get(key);

      if (key.includes('CANVAS')) return 'CANVAS PHOTOS (ORDERS SHOULD BE PLACED IN EVEN NUMBERS)';
      if (key.includes('FRAMED')) return 'FRAMED PICTURES';
      if (key.includes('LAMINATED')) return 'LAMINATED';
      if (key === 'MOUNTED' || key.includes(' MOUNTED')) return 'MOUNTED';
      if (key.includes('BLACK') && key.includes('MOUNT')) return 'BLACK/WHITE MOUNTED GLOSS';
      if (key.includes('BLACK') && key.includes('WHITE')) return 'BLACK & WHITE';
      if (key.includes('SEPIA') && key.includes('MOUNT')) return 'SEPIA PRINT MOUNTD GLOSS';
      if (key.includes('SEPIA') && key.includes('PHOTO')) return 'SEPIA PHOTO';
      if (key.includes('SEPIA') && key.includes('PRINT')) return 'SEPIA PRINT';
      if (key.includes('PRINT')) return 'PRINT';
      if (key.includes('PHOTO')) return 'PHOTO';

      return raw ? raw.toUpperCase() : 'PHOTOS';
    }

    function formatRemarkHtml(remarks) {
      const parts = String(remarks || '').split(',').map(x => x.trim()).filter(Boolean);
      return parts.map(part => {
        if (normalizeKey(part) === 'SOSRC') {
          return `<span class="sosrc-remark">${escapeHtml(part)}</span>`;
        }
        return escapeHtml(part);
      }).join(', ');
    }

    function formatRemarkText(remarks) {
      const parts = String(remarks || '').split(',').map(x => x.trim()).filter(Boolean);
      return parts.join(', ');
    }

    function populateLanguageFilter(rows) {
      const langs = [...new Set(rows.map(r => r.language).filter(Boolean))]
        .sort((a, b) => {
          const ai = getLanguageRank(a);
          const bi = getLanguageRank(b);
          if (ai !== bi) return ai - bi;
          return a.localeCompare(b);
        });

      els.languageFilter.innerHTML = `
        <option value="ALL">All languages</option>
        ${langs.map(lang => `<option value="${escapeHtml(lang)}">${escapeHtml(lang)}</option>`).join('')}
      `;
    }

    function sortRows(rows) {
      const sorted = [...rows];
      const mode = els.sortFilter.value;

      sorted.sort((a, b) => {
        switch (mode) {
          case 'TITLE_ASC':
            return a.title.localeCompare(b.title, undefined, { sensitivity: 'base' });
          case 'TITLE_DESC':
            return b.title.localeCompare(a.title, undefined, { sensitivity: 'base' });
          case 'MMS_ASC':
            return compareMixed(a.mmsCode, b.mmsCode);
          case 'MMS_DESC':
            return compareMixed(b.mmsCode, a.mmsCode);
          case 'CODE_ASC':
            return a.code.localeCompare(b.code, undefined, { sensitivity: 'base', numeric: true });
          case 'CODE_DESC':
            return b.code.localeCompare(a.code, undefined, { sensitivity: 'base', numeric: true });
          case 'SALE_ASC':
            return a.salePrice - b.salePrice;
          case 'SALE_DESC':
            return b.salePrice - a.salePrice;
          case 'COST_ASC':
            return a.costPrice - b.costPrice;
          case 'COST_DESC':
            return b.costPrice - a.costPrice;
          case 'LANG_TITLE_ASC':
          default: {
            const ai = getLanguageRank(a.language);
            const bi = getLanguageRank(b.language);
            if (ai !== bi) return ai - bi;
            const langCmp = a.language.localeCompare(b.language);
            if (langCmp !== 0) return langCmp;
            return a.title.localeCompare(b.title, undefined, { sensitivity: 'base' });
          }
        }
      });

      return sorted;
    }

    function applyFilters() {
      const searchTerm = normalizeKey(els.searchInput.value);
      const languageValue = els.languageFilter.value;
      const remarksValue = els.remarksFilter.value;

      let filtered = state.rows.filter(row => {
        const matchesSearch = !searchTerm || [
          row.title,
          row.mmsCode,
          row.code,
          row.remarks
        ].some(v => normalizeKey(v).includes(searchTerm));

        const matchesLanguage = languageValue === 'ALL' || row.language === languageValue;

        let matchesRemark = true;
        if (remarksValue === 'NO_REMARKS') {
          matchesRemark = !String(row.remarks || '').trim();
        } else if (remarksValue !== 'ALL') {
          matchesRemark = String(row.remarks || '')
            .split(',')
            .map(x => x.trim())
            .includes(remarksValue);
        }

        return matchesSearch && matchesLanguage && matchesRemark;
      });

      filtered = sortRows(filtered);

      state.filteredRows = filtered;
      state.groupedRows = buildGroupedRows(filtered);

      updateVisibleStats();
      renderTable();
    }

    function updateVisibleStats() {
      const shownBooks = state.filteredRows.length;
      const shownMatchedStock = state.filteredRows.filter(r => r.hasStock).length;
      const shownSosrc = state.filteredRows.filter(r =>
        String(r.remarks || '').split(',').map(x => x.trim()).includes('SOSRC')
      ).length;
      const shownLanguages = new Set(state.filteredRows.map(r => r.language)).size;

      els.booksCount.textContent = String(shownBooks);
      els.matchCount.textContent = String(shownMatchedStock);
      els.sosrcCount.textContent = String(shownSosrc);
      els.langCount.textContent = String(shownLanguages);
      els.exceptionCount.textContent = String(
        state.exceptionRows.length + state.photoExceptionRows.length + state.calendarExceptionRows.length + state.audioExceptionRows.length
      );
    }

          if (row.isGrayStock) {
            row.qty = 0;
            event.target.value = '';
            if (saleCell) saleCell.textContent = currency(0);
            if (costCell) costCell.textContent = currency(0);
            return;
          }

          row.qty = qty;

          if (saleCell) saleCell.textContent = currency(qty * row.salePrice);
          if (costCell) costCell.textContent = currency(qty * row.costPrice);
        });
      });
    }

    function addCellStyle(cell, fillArgb, bold = false, align = 'center', wrap = true) {
      cell.fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: fillArgb } };
      cell.font = { name: 'Arial', size: 10, bold, color: { argb: 'FF111111' } };
      cell.alignment = { vertical: 'middle', horizontal: align, wrapText: wrap };
      cell.border = {
        top: { style: 'thin', color: { argb: 'FF111111' } },
        left: { style: 'thin', color: { argb: 'FF111111' } },
        bottom: { style: 'thin', color: { argb: 'FF111111' } },
        right: { style: 'thin', color: { argb: 'FF111111' } }
      };
    }

    function applySosrcRichText(cell, remarks) {
      const parts = String(remarks || '').split(',').map(x => x.trim()).filter(Boolean);
      if (!parts.length) {
        cell.value = '';
        return;
      }

      const richText = [];
      parts.forEach((part, idx) => {
        const isSosrc = normalizeKey(part) === 'SOSRC';
        richText.push({
          text: part,
          font: {
            name: 'Arial',
            size: 10,
            bold: false,
            italic: isSosrc,
            color: { argb: isSosrc ? 'FF0000FF' : 'FF111111' }
          }
        });
        if (idx < parts.length - 1) {
          richText.push({
            text: ', ',
            font: { name: 'Arial', size: 10, color: { argb: 'FF111111' } }
          });
        }
      });

      cell.value = { richText };
    }

    function styleDataRow(row, fillArgb, item = {}) {
      row.eachCell({ includeEmpty: true }, cell => {
        const isQtyCell = cell.col === 5;
        const cellFill = isQtyCell && !item.isGrayStock ? 'FFFFFFFF' : fillArgb;
        addCellStyle(cell, cellFill, false, cell.col === 3 || cell.col === 4 ? 'left' : 'center', true);

        if (isQtyCell) {
          cell.protection = { locked: !!item.isGrayStock };
        } else {
          cell.protection = { locked: false };
        }

        if (cell.col === 3 || cell.col === 4) {
          cell.alignment = { vertical: 'top', horizontal: 'left', wrapText: true };
        }
      });

      if (item.remarks) {
        applySosrcRichText(row.getCell(4), item.remarks);
        row.getCell(4).alignment = { vertical: 'top', horizontal: 'left', wrapText: true };
      }

      [6, 7, 8, 9].forEach(i => row.getCell(i).numFmt = '#,##0.00');
      row.getCell(5).numFmt = '0';
      row.getCell(5).alignment = { vertical: 'middle', horizontal: 'center' };
    }

    function getBookFill(item) {
      if (item.isGrayStock) return 'FFBFC3C9';
      if (item.isIndiaLow) return 'FFD9EAD3';
      if (item.isDlLow) return 'FFD9C3A5';
      if (item.isSosrc) return 'FFF8D7DA';
      return 'FFD8FFFF';
    }

    function addGroupedSheet(workbook, sheetName, rows, options = {}) {
      const { includeCentreDate = false, isBooks = false } = options;

      const ws = workbook.addWorksheet(sheetName);
      ws.columns = [
        { key: 'code', width: 16.5 },
        { key: 'mmsCode', width: 9.6 },
        { key: 'title', width: 46.5 },
        { key: 'remarks', width: 20 },
        { key: 'qty', width: 9.6 },
        { key: 'salePrice', width: 10.7 },
        { key: 'costPrice', width: 10.3 },
        { key: 'saleAmount', width: 11.8 },
        { key: 'costAmount', width: 13.5 }
      ];

      let startHeaderRow = 1;

      if (includeCentreDate) {
        ws.mergeCells('A1:D1');
        ws.mergeCells('E1:I1');
        ws.getCell('A1').value = 'Centre';
        ws.getCell('E1').value = 'Date';
        addCellStyle(ws.getCell('A1'), 'FFD8FFFF', false, 'left');
        addCellStyle(ws.getCell('E1'), 'FFD8FFFF', false, 'center');
        ws.getRow(1).height = 24;
        startHeaderRow = 2;
      }

      const headers = ['CODE', 'MMS CODE', 'TITLE', 'Remarks', 'Qty.', 'SALE PRICE', 'COST PRICE', 'Sale Amount', 'Cost Amount'];
      headers.forEach((header, index) => {
        const cell = ws.getCell(startHeaderRow, index + 1);
        cell.value = header;
        addCellStyle(cell, 'FFD8FFFF', true, index === 2 || index === 3 ? 'left' : 'center');
      });
      ws.getRow(startHeaderRow).height = 40;

      let rowNum = startHeaderRow + 1;

      for (const item of rows) {
        if (item.type === 'group') {
          for (let col = 1; col <= 9; col++) {
            const cell = ws.getCell(rowNum, col);
            cell.value = col === 3 ? item.label : '';
            addCellStyle(cell, 'FF00008B', true, col === 3 ? 'left' : 'center');
            cell.font = { name: 'Arial', size: 10, bold: true, color: { argb: 'FFFFFFFF' } };
          }
          ws.getRow(rowNum).height = 20;
          rowNum += 1;
          continue;
        }

        const row = ws.getRow(rowNum);
        row.getCell(1).value = item.code;
        row.getCell(2).value = item.mmsCode || '';
        row.getCell(3).value = item.title;
        row.getCell(4).value = item.remarks || '';
        row.getCell(5).value = item.isGrayStock ? null : (Number(item.qty) || null);
        row.getCell(6).value = item.salePrice;
        row.getCell(7).value = item.costPrice;
        row.getCell(8).value = { formula: `E${rowNum}*F${rowNum}` };
        row.getCell(9).value = { formula: `E${rowNum}*G${rowNum}` };

        const fillArgb = isBooks ? getBookFill(item) : 'FFD8FFFF';

        styleDataRow(row, fillArgb, item);
        rowNum += 1;
      }

      ws.views = [{ state: 'frozen', ySplit: includeCentreDate ? 2 : 1 }];

      // Protect sheet so only Out of Stock Qty cells are blocked.
      // All other cells are unlocked above, so users can still fill normal Qty cells.
      ws.protect('', {
        selectLockedCells: true,
        selectUnlockedCells: true,
        formatCells: true,
        formatColumns: true,
        formatRows: true,
        insertRows: true,
        deleteRows: true,
        sort: true,
        autoFilter: true
      });

      return ws;
    }

    function cloneForExcelJs(value) {
      if (value === null || value === undefined) return value;
      if (value instanceof Date) return new Date(value.getTime());
      if (typeof value !== 'object') return value;
      return JSON.parse(JSON.stringify(value));
    }

    function yieldToBrowser() {
      return new Promise(resolve => setTimeout(resolve, 0));
    }

    function findExcelJsWorksheetByName(workbook, preferredName, fallbackKeyword = '') {
      if (!workbook) return null;
      const preferredKey = normalizeKey(preferredName);
      const exact = workbook.worksheets.find(ws => normalizeKey(ws.name) === preferredKey);
      if (exact) return exact;

      if (fallbackKeyword) {
        const fallbackKey = normalizeKey(fallbackKeyword);
        return workbook.worksheets.find(ws => normalizeKey(ws.name).includes(fallbackKey)) || null;
      }

      return null;
    }

    function columnLettersToNumber(letters) {
      let num = 0;
      const text = String(letters || '').toUpperCase();
      for (let i = 0; i < text.length; i++) {
        const code = text.charCodeAt(i);
        if (code < 65 || code > 90) continue;
        num = num * 26 + (code - 64);
      }
      return num;
    }

    function parseCellAddress(address) {
      const match = String(address || '').match(/^([A-Z]+)(\d+)$/i);
      if (!match) return { row: 0, col: 0 };
      return { col: columnLettersToNumber(match[1]), row: Number(match[2]) || 0 };
    }

    function parseRange(range) {
      const parts = String(range || '').split(':');
      const start = parseCellAddress(parts[0]);
      const end = parseCellAddress(parts[1] || parts[0]);
      return {
        top: Math.min(start.row, end.row),
        bottom: Math.max(start.row, end.row),
        left: Math.min(start.col, end.col),
        right: Math.max(start.col, end.col)
      };
    }

    function cellHasContentOrStyle(cell) {
      if (!cell) return false;
      if (cell.value !== null && cell.value !== undefined && cell.value !== '') return true;
      const style = cell.style || {};
      return Object.keys(style).length > 0;
    }

    async function copyWorksheetIntoWorkbookFast(sourceWorksheet, targetWorkbook, targetName) {
      if (!sourceWorksheet) return false;

      const targetWorksheet = targetWorkbook.addWorksheet(targetName);
      targetWorksheet.properties = cloneForExcelJs(sourceWorksheet.properties || {});
      targetWorksheet.pageSetup = cloneForExcelJs(sourceWorksheet.pageSetup || {});
      targetWorksheet.views = cloneForExcelJs(sourceWorksheet.views || []);
      targetWorksheet.state = sourceWorksheet.state;

      const merges = sourceWorksheet.model && Array.isArray(sourceWorksheet.model.merges)
        ? sourceWorksheet.model.merges
        : [];

      let maxRow = 1;
      let maxCol = 1;

      sourceWorksheet.eachRow({ includeEmpty: false }, (row, rowNumber) => {
        maxRow = Math.max(maxRow, rowNumber);
        row.eachCell({ includeEmpty: false }, (cell, colNumber) => {
          if (cellHasContentOrStyle(cell)) {
            maxCol = Math.max(maxCol, colNumber);
          }
        });
      });

      merges.forEach(rangeText => {
        const range = parseRange(rangeText);
        if (range.bottom && range.right) {
          maxRow = Math.max(maxRow, range.bottom);
          maxCol = Math.max(maxCol, range.right);
        }
      });

      maxRow = Math.min(maxRow, 500);
      maxCol = Math.min(maxCol, 80);

      for (let col = 1; col <= maxCol; col++) {
        const sourceColumn = sourceWorksheet.getColumn(col);
        const targetColumn = targetWorksheet.getColumn(col);
        targetColumn.width = sourceColumn.width;
        targetColumn.hidden = sourceColumn.hidden;
        targetColumn.outlineLevel = sourceColumn.outlineLevel;
        if (sourceColumn.style) targetColumn.style = cloneForExcelJs(sourceColumn.style);
      }

      for (let rowNumber = 1; rowNumber <= maxRow; rowNumber++) {
        const sourceRow = sourceWorksheet.getRow(rowNumber);
        const targetRow = targetWorksheet.getRow(rowNumber);
        targetRow.height = sourceRow.height;
        targetRow.hidden = sourceRow.hidden;
        targetRow.outlineLevel = sourceRow.outlineLevel;
        if (sourceRow.style) targetRow.style = cloneForExcelJs(sourceRow.style);

        for (let colNumber = 1; colNumber <= maxCol; colNumber++) {
          const sourceCell = sourceRow.getCell(colNumber);
          if (!cellHasContentOrStyle(sourceCell)) continue;

          const targetCell = targetWorksheet.getCell(rowNumber, colNumber);
          targetCell.value = cloneForExcelJs(sourceCell.value);
          targetCell.style = cloneForExcelJs(sourceCell.style || {});

          if (sourceCell.numFmt) targetCell.numFmt = sourceCell.numFmt;
          if (sourceCell.alignment) targetCell.alignment = cloneForExcelJs(sourceCell.alignment);
          if (sourceCell.border) targetCell.border = cloneForExcelJs(sourceCell.border);
          if (sourceCell.fill) targetCell.fill = cloneForExcelJs(sourceCell.fill);
          if (sourceCell.font) targetCell.font = cloneForExcelJs(sourceCell.font);
          if (sourceCell.protection) targetCell.protection = cloneForExcelJs(sourceCell.protection);
          if (sourceCell.note) targetCell.note = cloneForExcelJs(sourceCell.note);
        }

        if (rowNumber % 20 === 0) await yieldToBrowser();
      }

      merges.forEach(rangeText => {
        const range = parseRange(rangeText);
        if (range.bottom <= maxRow && range.right <= maxCol) {
          try {
            targetWorksheet.mergeCells(rangeText);
          } catch (error) {
            console.warn(`Could not copy merged range ${rangeText} from ${sourceWorksheet.name}`, error);
          }
        }
      });

      return targetWorksheet;
    }

    function clearOrderSummarySaleAmountColumns(worksheet) {
      if (!worksheet) return;

      const saleAmountColumns = [];
      let headerRowNumber = 0;

      const maxHeaderScanRows = Math.min(20, worksheet.rowCount || 20);
      const maxCols = Math.min(80, worksheet.columnCount || 80);

      for (let rowNumber = 1; rowNumber <= maxHeaderScanRows; rowNumber++) {
        const row = worksheet.getRow(rowNumber);

        for (let colNumber = 1; colNumber <= maxCols; colNumber++) {
          const cell = row.getCell(colNumber);
          const cellText = normalizeKey(
            cell && cell.value && typeof cell.value === 'object' && cell.value.richText
              ? cell.value.richText.map(part => part.text || '').join('')
              : cell.value && typeof cell.value === 'object' && cell.value.text
                ? cell.value.text
                : cell.value
          );

          if (cellText === 'SALE AMOUNT' || cellText.includes('SALE AMOUNT')) {
            saleAmountColumns.push(colNumber);
            headerRowNumber = headerRowNumber ? Math.min(headerRowNumber, rowNumber) : rowNumber;
          }
        }
      }

      if (!saleAmountColumns.length || !headerRowNumber) return;

      const uniqueColumns = [...new Set(saleAmountColumns)];
      const lastRow = Math.min(worksheet.rowCount || 500, 500);

      for (let rowNumber = headerRowNumber + 1; rowNumber <= lastRow; rowNumber++) {
        for (const colNumber of uniqueColumns) {
          const cell = worksheet.getCell(rowNumber, colNumber);
          const value = cell.value;

          const isNumericValue = typeof value === 'number';
          const isFormulaValue = value && typeof value === 'object' && Object.prototype.hasOwnProperty.call(value, 'formula');
          const isNumericString = typeof value === 'string' && value.trim() !== '' && !Number.isNaN(Number(value.replace(/,/g, '')));

          // Keep labels/text like GST @18% on Cost Price and Grand Total of Cost Price.
          // Only clear numbers/formulas that were auto-filled in Sale Amount columns.
          if (isNumericValue || isFormulaValue || isNumericString) {
            cell.value = null;
          }
        }
      }
    }

    async function copyTemplateSheetsToMainWorkbook(workbook) {
      if (!state.previousIndentTemplateBuffer) return;

      const previousWorkbook = new ExcelJS.Workbook();
      await previousWorkbook.xlsx.load(state.previousIndentTemplateBuffer.slice(0));

      const instructionsSheet = findExcelJsWorksheetByName(previousWorkbook, 'Instructions', 'INSTRUCTION');
      const orderSummarySheet = findExcelJsWorksheetByName(previousWorkbook, 'ORDER Summary', 'ORDER');

      if (instructionsSheet) {
        await copyWorksheetIntoWorkbookFast(instructionsSheet, workbook, 'Instructions');
      } else {
        const ws = workbook.addWorksheet('Instructions');
        ws.getCell('A1').value = 'Instructions sheet was not found in the uploaded Previous Indent workbook.';
      }

      if (orderSummarySheet) {
        const copiedOrderSummarySheet = await copyWorksheetIntoWorkbookFast(orderSummarySheet, workbook, 'ORDER Summary');
        clearOrderSummarySaleAmountColumns(copiedOrderSummarySheet);
      } else {
        const ws = workbook.addWorksheet('ORDER Summary');
        ws.getCell('A1').value = 'ORDER Summary sheet was not found in the uploaded Previous Indent workbook.';
      }
    }

      const workbook = new ExcelJS.Workbook();

      await copyTemplateSheetsToMainWorkbook(workbook);

      addGroupedSheet(

        buildGroupedRows(sortRows(state.rows)),

    function getShortCodeSetFromPreviousRows(rows) {
      if (!rows.length) return new Set();

      const first = rows[0];
      const codeCol = findColumn(first, ['CODE', 'Code']);
      const shortCodeCol = findColumn(first, ['Short Code', 'SHORT CODE']);
      const out = new Set();

      for (const row of rows) {
        let shortCode = '';
        if (shortCodeCol) shortCode = normalizeCode(row[shortCodeCol]);
        if (!shortCode && codeCol) shortCode = toShortCode(row[codeCol]);

        const title = normalizeKey(row[findColumn(row, ['TITLE', 'Title'])] || '');
        if (title.includes('TOTAL')) continue;

        if (shortCode && shortCode !== 'TOTAL') out.add(shortCode);
      }

      return out;
    }

    function processPhotos(masterRowsRaw, stockRowsRaw, previousIndentShortCodeSet) {
      if (!masterRowsRaw.length) return { rows: [], exceptions: [] };

      const first = masterRowsRaw[0];
      const cols = {
        mms: findColumn(first, ['Item Number (MMS)', 'ITEM NUMBER (MMS)', 'MMS Code', 'MMS CODE']),
        photoCode: findColumn(first, ['Photo code', 'PHOTO CODE']),
        title: findColumn(first, ['Item Details', 'ITEM DETAILS']),
        oldLatest: findColumn(first, ['Old/Latest', 'OLD/LATEST', 'Old Latest']),
        shortCode: findColumn(first, ['Short Code', 'SHORT CODE']),
        photoType: findColumn(first, ['Photo type', 'PHOTO TYPE', 'Photo Type']),
        bavCode: findColumn(first, ['BAV Code', 'BAV CODE']),
        salePrice: findColumn(first, ['Sale Price (Rs.)', 'SALE PRICE (RS.)', 'Sale Price']),
        costPrice: findColumn(first, ['Cost Price (Rs.)', 'COST PRICE (RS.)', 'Cost Price'])
      };

      if (!cols.oldLatest) {
        throw new Error('Photos Master sheet is missing Old/Latest column.');
      }

      const stockMap = new Set();
      if (stockRowsRaw.length) {
        const stockFirst = stockRowsRaw[0];
        const stockShortCodeCol = findColumn(stockFirst, ['Short Code', 'SHORT CODE']);
        const stockBavCol = findColumn(stockFirst, ['BAV Code', 'BAV CODE']);

        for (const row of stockRowsRaw) {
          let shortCode = '';
          if (stockShortCodeCol) shortCode = normalizeCode(row[stockShortCodeCol]);
          if (!shortCode && stockBavCol) shortCode = toShortCode(row[stockBavCol]);
          if (shortCode) stockMap.add(shortCode);
        }
      }

      const rows = masterRowsRaw
        .map((row, idx) => {
          const oldLatest = normalizeKey(row[cols.oldLatest]);
          if (oldLatest !== 'LATEST') return null;

          const mmsCode = normalizeMms(row[cols.mms]);
          const title = normalizeText(row[cols.title]);
          const displayCode = normalizeText(row[cols.bavCode] || row[cols.photoCode]);
          const shortCode = normalizeCode(row[cols.shortCode]) || toShortCode(row[cols.bavCode] || row[cols.photoCode]);
          const salePrice = normalizeNumber(row[cols.salePrice]);
          const costPrice = normalizeNumber(row[cols.costPrice]);
          const category = normalizeText(row[cols.photoType]).toUpperCase() || 'PHOTOS';

          if (!shortCode && !displayCode && !title) return null;

          return {
            id: `photo-${shortCode || displayCode || idx}`,
            code: displayCode,
            shortCode,
            mmsCode,
            title,
            category,
            remarks: '',
            qty: 0,
            salePrice,
            costPrice,
            hasStock: shortCode ? stockMap.has(shortCode) : false
          };
        })
        .filter(Boolean);

      return {
        rows,
        exceptions: rows.filter(r => r.shortCode && !previousIndentShortCodeSet.has(r.shortCode))
      };
    }
